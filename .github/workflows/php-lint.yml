name: Validar sintaxe PHP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verificar todos os arquivos PHP
        run: |
          find app public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
